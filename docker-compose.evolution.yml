services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: barbearia_evolution_api
    restart: unless-stopped
    env_file:
      - .env.evolution
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-local

  evolution-postgres:
    image: postgres:15-alpine
    container_name: barbearia_evolution_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - evolution_postgres:/var/lib/postgresql/data
    networks:
      - evolution-local

  evolution-redis:
    image: redis:7-alpine
    container_name: barbearia_evolution_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - evolution_redis:/data
    networks:
      - evolution-local

volumes:
  evolution_instances:
  evolution_postgres:
  evolution_redis:

networks:
  evolution-local:
    driver: bridge
