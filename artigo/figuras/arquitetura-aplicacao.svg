<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura geral da aplicação</title>
  <desc id="desc">Diagrama com interface React e Vite, API Express, serviços e regras de negócio, Prisma ORM e banco PostgreSQL.</desc>
  <defs>
    <style>
      .box { fill:#fff; stroke:#1f4b73; stroke-width:3; rx:14; }
      .title { font: 700 25px Arial, sans-serif; fill:#102a43; text-anchor:middle; }
      .text { font: 17px Arial, sans-serif; fill:#334e68; text-anchor:middle; }
      .arrow { stroke:#b22222; stroke-width:4; marker-end:url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#b22222"/></marker>
  </defs>
  <rect width="1200" height="540" fill="#f7fafc"/>
  <text x="600" y="58" class="title" style="font-size:31px">Arquitetura da aplicação de agendamento</text>
  <rect x="70" y="170" width="190" height="150" class="box"/>
  <text x="165" y="224" class="title">Cliente</text><text x="165" y="255" class="text">React + Vite</text><text x="165" y="283" class="text">Interface web</text>
  <line x1="260" y1="245" x2="345" y2="245" class="arrow"/>
  <rect x="350" y="170" width="190" height="150" class="box"/>
  <text x="445" y="224" class="title">API REST</text><text x="445" y="255" class="text">Express</text><text x="445" y="283" class="text">Operações</text>
  <line x1="540" y1="245" x2="625" y2="245" class="arrow"/>
  <rect x="630" y="150" width="220" height="190" class="box"/>
  <text x="740" y="211" class="title">Serviços</text><text x="740" y="241" class="title">e regras</text><text x="740" y="274" class="text">Disponibilidade, permissões</text><text x="740" y="300" class="text">e validações</text>
  <line x1="850" y1="245" x2="935" y2="245" class="arrow"/>
  <rect x="940" y="170" width="190" height="150" class="box"/>
  <text x="1035" y="224" class="title">Persistência</text><text x="1035" y="255" class="text">Prisma ORM</text><text x="1035" y="283" class="text">PostgreSQL</text>
  <text x="600" y="440" class="text" style="font-size:20px">As verificações de negócio ocorrem antes do registro da reserva no banco de dados.</text>
</svg>
