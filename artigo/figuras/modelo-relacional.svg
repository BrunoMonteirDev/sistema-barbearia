<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Modelo relacional do núcleo de agendamento</title>
  <desc id="desc">Diagrama das entidades Usuário, Profissional, Serviço, Jornada, Agendamento, Histórico e Notificação.</desc>
  <defs><style>
    .box{fill:#fff;stroke:#1f4b73;stroke-width:2.5;rx:10}.head{fill:#1f4b73;rx:9}.name{font:700 20px Arial;fill:#fff;text-anchor:middle}.field{font:16px Arial;fill:#243b53}.line{stroke:#b22222;stroke-width:3}.label{font:15px Arial;fill:#7b1f1f}
  </style></defs>
  <rect width="1200" height="720" fill="#f7fafc"/><text x="600" y="48" style="font:700 29px Arial;fill:#102a43;text-anchor:middle">Modelo relacional do núcleo de agendamento</text>
  <g><rect x="65" y="130" width="205" height="145" class="box"/><rect x="65" y="130" width="205" height="40" class="head"/><text x="167" y="157" class="name">USUÁRIO</text><text x="85" y="198" class="field">id, nome, e-mail</text><text x="85" y="225" class="field">perfil, credenciais</text></g>
  <g><rect x="65" y="430" width="205" height="130" class="box"/><rect x="65" y="430" width="205" height="40" class="head"/><text x="167" y="457" class="name">PROFISSIONAL</text><text x="85" y="498" class="field">id, dados, ativo</text><text x="85" y="525" class="field">jornadas semanais</text></g>
  <g><rect x="455" y="108" width="275" height="190" class="box"/><rect x="455" y="108" width="275" height="40" class="head"/><text x="592" y="135" class="name">AGENDAMENTO</text><text x="475" y="178" class="field">data, horário e situação</text><text x="475" y="205" class="field">usuário, profissional e serviço</text><text x="475" y="232" class="field">duração e valor registrados</text><text x="475" y="259" class="field">alterações vinculadas</text></g>
  <g><rect x="930" y="130" width="205" height="130" class="box"/><rect x="930" y="130" width="205" height="40" class="head"/><text x="1032" y="157" class="name">SERVIÇO</text><text x="950" y="198" class="field">id, nome, ativo</text><text x="950" y="225" class="field">duração e valor</text></g>
  <g><rect x="445" y="430" width="180" height="130" class="box"/><rect x="445" y="430" width="180" height="40" class="head"/><text x="535" y="457" class="name">HISTÓRICO</text><text x="465" y="498" class="field">alteração, data</text><text x="465" y="525" class="field">e responsável</text></g>
  <g><rect x="760" y="430" width="190" height="130" class="box"/><rect x="760" y="430" width="190" height="40" class="head"/><text x="855" y="457" class="name">NOTIFICAÇÃO</text><text x="780" y="498" class="field">tipo, estado</text><text x="780" y="525" class="field">e destinatário</text></g>
  <line x1="270" y1="200" x2="455" y2="200" class="line"/><text x="360" y="190" class="label">realiza</text>
  <line x1="270" y1="495" x2="455" y2="260" class="line"/><text x="335" y="355" class="label">atende</text>
  <line x1="730" y1="200" x2="930" y2="200" class="line"/><text x="820" y="190" class="label">utiliza</text>
  <line x1="585" y1="298" x2="535" y2="430" class="line"/><text x="550" y="370" class="label">registra</text>
  <line x1="670" y1="298" x2="855" y2="430" class="line"/><text x="790" y="370" class="label">origina</text>
  <text x="600" y="650" style="font:17px Arial;fill:#334e68;text-anchor:middle">A jornada se relaciona ao profissional e define os períodos que podem ser consultados antes da criação do agendamento.</text>
</svg>
