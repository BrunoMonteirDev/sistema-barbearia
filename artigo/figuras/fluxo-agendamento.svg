<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Fluxo de agendamento</title>
  <desc id="desc">O cliente seleciona dados, consulta horários, revisa, autentica e a API valida antes de gravar no banco.</desc>
  <defs><style>.box{fill:#f8fafc;stroke:#1e3a5f;stroke-width:2}.text{font:16px Arial;fill:#0f172a}.arrow{stroke:#b91c1c;stroke-width:3;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/></marker></defs>
  <rect class="box" x="25" y="110" width="150" height="70" rx="10"/><text class="text" x="48" y="140">Escolhas do</text><text class="text" x="53" y="162">cliente</text>
  <line class="arrow" x1="175" y1="145" x2="235" y2="145"/><rect class="box" x="235" y="110" width="155" height="70" rx="10"/><text class="text" x="252" y="140">Consulta de</text><text class="text" x="258" y="162">disponibilidade</text>
  <line class="arrow" x1="390" y1="145" x2="450" y2="145"/><rect class="box" x="450" y="110" width="145" height="70" rx="10"/><text class="text" x="474" y="140">Revisão e</text><text class="text" x="472" y="162">aceite</text>
  <line class="arrow" x1="595" y1="145" x2="655" y2="145"/><rect class="box" x="655" y="110" width="155" height="70" rx="10"/><text class="text" x="679" y="140">API valida</text><text class="text" x="674" y="162">novamente</text>
  <line class="arrow" x1="810" y1="145" x2="870" y2="145"/><rect class="box" x="870" y="110" width="145" height="70" rx="10"/><text class="text" x="896" y="140">Prisma e</text><text class="text" x="888" y="162">PostgreSQL</text>
  <line class="arrow" x1="1015" y1="145" x2="1075" y2="145"/><rect class="box" x="1075" y="110" width="100" height="70" rx="10"/><text class="text" x="1086" y="150">Retorno</text>
</svg>
